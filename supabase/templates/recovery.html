<!--
  Password reset (recovery) email.
  Recolored/restructured to match lib/theme.ts + DESIGN.md — this file has no way to
  import those tokens directly (separate deploy target, pushed via `supabase config
  push`), so the correspondence is spelled out below. Keep them in sync by hand if
  either changes.

    background      #0A0A0A  colors.background
    surface         #161616  colors.surface   (card fill)
    surfaceRaised   #1E1E1E  colors.surfaceRaised (code plate — tonal elevation over the card)
    border          #262626  colors.border    (hairlines)
    textPrimary     #F5F5F5  colors.textPrimary
    textMuted       #8A8A8A  colors.textMuted
    textFaint       #4A4A4A  colors.textFaint
    radius.card=8, spacing.xxl=48/xl=32/lg=24/md=16/sm=8

  No hue anywhere (true neutral grayscale, per DESIGN.md's own "no separate warning
  color" rule) — the previous version's orange accent and bracket+dot logo mark were
  off-brand, not sourced from anything in the actual app. Dropped both: brand reads
  through the plain "piqa" wordmark alone, same as AuthHero.tsx does in-app, matching
  the monospace-for-data-only convention for the code itself.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#0A0A0A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A0A0A;padding:48px 20px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">

          <!-- Wordmark -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <span style="font-size:28px;font-weight:700;color:#F5F5F5;letter-spacing:-0.7px;">piqa</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#161616;border:1px solid #262626;border-radius:8px;padding:32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-bottom:8px;">
                    <span style="font-size:20px;font-weight:600;color:#F5F5F5;">Reset your password</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom:24px;">
                    <span style="font-size:16px;color:#8A8A8A;line-height:22px;">
                      Enter this code to reset your password. It expires in 1 hour.
                    </span>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-bottom:24px;">
                    <table cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="background-color:#1E1E1E;border-radius:8px;padding:16px 32px;border:1px solid #262626;">
                          <span style="font-size:32px;font-weight:600;color:#F5F5F5;letter-spacing:8px;font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;">
                            {{ .Token }}
                          </span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="border-top:1px solid #262626;padding-top:20px;">
                    <span style="font-size:13px;color:#4A4A4A;">
                      If you didn't request this, you can safely ignore this email.
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:32px;">
              <span style="font-size:12px;color:#4A4A4A;">
                piqa
              </span>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
